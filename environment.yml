name: ott3r
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pytorch>=2.1.0=*cuda*
  - torchvision>=0.16.0
  - torchaudio>=2.1.0
  - pytorch-cuda=12.1
  - mkl<2024

  - numpy>=1.24.0
  - scipy>=1.10.0
  - opencv>=4.8.0
  - pillow>=9.5.0

  - psutil>=5.9.0
  - pip

  - pip:
    - -r requirements.txt
